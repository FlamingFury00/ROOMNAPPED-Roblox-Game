name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting, lint, type analysis, the place build and every headless test except the authored
  # mission playthroughs and the chaos soak (those run in parallel below).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: tools/install-toolchain.sh "$HOME/rbxtools" >> "$GITHUB_PATH"

      - name: Format (StyLua)
        run: stylua --check src tests tools

      - name: Lint (selene)
        run: |
          selene generate-roblox-std
          selene src

      - name: Type analysis, build and headless tests
        env:
          RN_SKIP_LAYOUT_SIMS: "1"
          RN_SKIP_CHAOS: "1"
        run: tools/check.sh

      - name: Build release place
        run: tools/build.sh build/ROOMNAPPED.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: ROOMNAPPED-place
          path: build/ROOMNAPPED.rbxl
          if-no-files-found: error

  # Every mission layout played start to finish by a scripted player with the real client attached.
  playthroughs:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: tools/install-toolchain.sh "$HOME/rbxtools" >> "$GITHUB_PATH"

      - name: Build test place
        run: tools/build.sh build/test.rbxl

      - name: Authored mission playthroughs
        run: lune run tests/run.luau build/test.rbxl "Authored playthroughs"

  # Random squads (valid, invalid and malformed requests, drop-outs, rejoins) on every mission.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: tools/install-toolchain.sh "$HOME/rbxtools" >> "$GITHUB_PATH"

      - name: Build test place
        run: tools/build.sh build/test.rbxl

      - name: Chaos soak
        run: lune run tests/run.luau build/test.rbxl "Chaos soak"
